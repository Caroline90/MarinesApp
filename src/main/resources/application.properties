spring.application.name=Maritime Intelligence
server.port=8080

# Serve the browser UI from src/main/resources/static with Spring Boot's static resource handling.

# Redis-backed vessel cache. Start the bundled Redis container with: docker compose up -d redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Maritime Intelligence v0.7 AISStream connection.
aisstream.enabled=true
aisstream.url=wss://stream.aisstream.io/v0/stream
aisstream.api-key=${AISSTREAM_API_KEY:}

# Smaller European test bounding box around the Świnoujście / Baltic ferry corridor.
aisstream.min-latitude=53.84
aisstream.min-longitude=14.16
aisstream.max-latitude=54.02
aisstream.max-longitude=14.42

# Keep the dashboard useful when the selected live bounding box is quiet or AISStream
# has not delivered any frames yet. Demo records are clearly labeled as such in the UI.
aisstream.demo-fallback-enabled=true
